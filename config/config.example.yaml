# MedAgentX Platform Configuration

# Platform Settings
platform:
  name: "MedAgentX"
  version: "0.1.0"
  environment: "development"  # development, staging, production
  
# LLM Configuration
llm:
  default_provider: "openai"  # openai, anthropic, etc.
  default_model: "gpt-4"
  temperature: 0.3
  max_tokens: 2000
  
  # Provider-specific settings
  openai:
    api_key: "${OPENAI_API_KEY}"  # Set via environment variable
    base_url: "https://api.openai.com/v1"
  
  anthropic:
    api_key: "${ANTHROPIC_API_KEY}"
    base_url: "https://api.anthropic.com"

# Agent Configuration
agents:
  max_iterations: 10
  enable_self_critique: true
  enable_reflection: true
  enable_planning: true
  default_temperature: 0.3

# Governance & Safety
governance:
  require_human_approval: true  # Mandatory for all recommendations
  min_confidence_threshold: 0.3
  enable_audit_logging: true
  audit_retention_days: 365

# Knowledge Base
knowledge:
  retrieval_strategy: "hybrid"  # dense, sparse, hybrid
  default_top_k: 5
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  
  # Vector Store
  vector_store:
    type: "faiss"  # faiss, chromadb, etc.
    index_path: "./data/vector_index"
  
  # Knowledge Sources
  sources:
    - type: "guidelines"
      path: "./data/guidelines"
    - type: "medical_codes"
      path: "./data/codes"

# Tools & MCP
tools:
  allow_user_created: true
  default_permission: "read_only"
  sandbox_enabled: true

# API Configuration
api:
  enabled: true
  host: "0.0.0.0"
  port: 8000
  cors_enabled: true
  api_key_required: false

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/medagentx.log"

# Clinical Safety Disclaimer (Mandatory)
safety:
  disclaimer: |
    This system provides clinical decision support, NOT autonomous diagnosis.
    All outputs are recommendations, not final decisions.
    Human (doctor) approval is mandatory before any diagnosis or treatment suggestion.

# ──────────────────────────────────────────────────────────────────────────────
# Observability — Self-hosted Langfuse v3
# ──────────────────────────────────────────────────────────────────────────────
# Langfuse is an open-source, self-hosted observability platform for LLM
# applications.  MedAgentX wires its OpenTelemetry TracerProvider into Langfuse
# so traces, governance events, CRF decisions, and LLM generations are
# queryable in a dashboard without data leaving your environment.
#
# Quick-start:
#   1. docker compose -f docker-compose.langfuse.yml up -d
#   2. Navigate to http://localhost:3000
#   3. Create a project → Settings → API Keys → copy public + secret keys
#   4. Set the three env vars below and restart the MedAgentX server.
#
# Environment variables (set in .env or shell before starting the server):
#
#   LANGFUSE_PUBLIC_KEY        — Public key from your Langfuse project
#                                Example: pk-lf-xxxxxxxxxxxxxxxxxxxx
#
#   LANGFUSE_SECRET_KEY        — Secret key from your Langfuse project
#                                Example: sk-lf-xxxxxxxxxxxxxxxxxxxx
#
#   LANGFUSE_HOST              — URL of your Langfuse server
#                                Default: http://localhost:3000
#                                Production example: https://langfuse.yourhospital.internal
#
# Optional tuning (BatchSpanProcessor defaults are sufficient for most loads):
#   OTEL_BSP_MAX_QUEUE_SIZE    — Max spans buffered before export (default: 2048)
#   OTEL_BSP_EXPORT_TIMEOUT    — Milliseconds before export times out (default: 30000)
#   OTEL_BSP_SCHEDULE_DELAY    — Milliseconds between export flushes (default: 5000)
#
# PII masking:
#   A PiiMaskingSpanProcessor scrubs the following attributes before they
#   reach Langfuse: patient_id, mrn, dob, ssn, nhs_number, email, phone,
#   address, full_name, first_name, last_name, and any key containing "pii_".
#   See docs/cybersecurity.md § 6 for full policy.
observability:
  langfuse:
    public_key: "${LANGFUSE_PUBLIC_KEY}"
    secret_key: "${LANGFUSE_SECRET_KEY}"
    host: "${LANGFUSE_HOST:-http://localhost:3000}"

